name: Windows .NET checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Inspect Windows prerequisites
        shell: pwsh
        run: ./scripts/dev.ps1 doctor
      - name: Restore, Release build, discovery, format and documentation
        shell: pwsh
        run: ./scripts/dev.ps1 check
      - name: Upload discovery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
